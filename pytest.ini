[pytest]
minversion = 8.0

testpaths =
    tests

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

norecursedirs =
    .git
    .pytest_cache
    __pycache__
    venv
    backup_tests_2026-09-05
    backup_encoding_*
    backup_layout_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --cov=core
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80

markers =
    unit: testes unitários sem dependências externas
    integration: testes de integração leve entre módulos
    manual: cenários validados manualmente na interface Streamlit