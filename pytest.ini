[pytest]
minversion = 8.0

testpaths =
    tests

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

norecursedirs =
    .git
    .pytest_cache
    __pycache__
    venv
    htmlcov

# Cobertura mínima de 95% no core/ (meta da versão congelada; hoje em 100%).
# Uma queda abaixo disso faz a suíte falhar, em vez de passar despercebida.
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --cov=core
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=95
