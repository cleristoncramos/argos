# Identidade visual do Argos: tema claro com profundidade, cantos retos e
# linhas finas escuras. O CSS complementar fica em app/ui/design.py.

[theme]
base = "light"
primaryColor = "#C8102E"
backgroundColor = "#F7F6F2"
secondaryBackgroundColor = "#EFEDE7"
textColor = "#111111"
borderColor = "#2A2A2A"
dataframeBorderColor = "#2A2A2A"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "none"
buttonRadius = "none"

[client]
toolbarMode = "minimal"
