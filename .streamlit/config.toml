# Identidade visual do Argos DataLab: tema escuro azul-marinho, cantos retos e
# linhas finas quase pretas. O CSS complementar fica em app/ui/design.py.

[theme]
base = "dark"
primaryColor = "#E5484D"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111A2E"
textColor = "#E6EAF2"
borderColor = "#04070D"
dataframeBorderColor = "#04070D"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "none"
buttonRadius = "none"

[client]
toolbarMode = "minimal"
