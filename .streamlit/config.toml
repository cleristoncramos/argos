# Identidade visual do Argos DataLab: tema claro, cantos retos e linhas pretas finas.
# O CSS complementar fica em app/ui/design.py.

[theme]
base = "light"
primaryColor = "#C8102E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F3"
textColor = "#111111"
borderColor = "#1F1F1F"
dataframeBorderColor = "#1F1F1F"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "none"
buttonRadius = "none"

[client]
toolbarMode = "minimal"
